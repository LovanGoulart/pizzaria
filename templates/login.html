<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Restaurante Manager</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
<div class="auth-box">
  <div class="auth-logo">🍽️</div>
  <h1>Restaurante Manager</h1>
  <p class="auth-sub">Entre para gerenciar seu restaurante</p>

  {% if erro %}<div class="auth-erro">{{ erro }}</div>{% endif %}

  <form method="POST" class="auth-form">
    <label>E-mail
      <input type="email" name="email" required autofocus placeholder="seu@email.com">
    </label>
    <label>Senha
      <input type="password" name="senha" required placeholder="••••••••">
    </label>
    <button type="submit" class="btn-primary">Entrar</button>
  </form>

  <p class="auth-link">Nao tem conta? <a href="/registro">Cadastre-se</a></p>

  <div class="auth-demo">
    <b>Demo:</b> admin@restaurante.com / admin123
  </div>
</div>
</body>
</html>
